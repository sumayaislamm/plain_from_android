<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyPort — Airport Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Navbar has its own stylesheet, kept separate on purpose -->
<link rel="stylesheet" href="navbar.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div>

    <header>
    </header>

    <main>



      <section class="panel-grid">

        <div>
          <table class="flight-table">
            <thead>

            </thead>
            <tbody>

            </tbody>
          </table>
        </div>



        <div class="panel" id="recent-alerts">
          <div class="panel-head">
            <h3>Recent Alerts</h3>
            <span class="panel-tag alert">3 New</span>
          </div>
          <ul class="alert-list">
            <li><span class="dot warn"></span> Gate B04 delayed due to late arrival</li>
            <li><span class="dot info"></span> Runway 2 scheduled maintenance, 22:00</li>
            <li><span class="dot danger"></span> Low visibility expected after 18:00</li>
          </ul>
        </div>

      </section>

    </main>
  </div>

  <!-- navbar.js must load before script.js calls initNavbar() -->
  <script src="js/navbar.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
